name: collect-company-signals

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Fallback lookback window in days"
        required: false
        default: "45"
      from_date:
        description: "Collection start date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      to_date:
        description: "Collection end date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      issue_number:
        description: "Report issue number"
        required: false
        default: "2"

      provider:
        description: "Review API to use"
        type: choice
        options: ["gemini", "nvidia"]
        default: "gemini"
      gemini_max_requests:
        description: "Maximum API requests including retries (1-400)"
        type: string
        default: "400"
      gemini_delay_ms:
        description: "Delay between requests in ms. Leave empty to use the provider default (gemini 4500, nvidia 1600)"
        type: string
        default: ""
      refresh:
        description: "Recollect sources instead of resuming the saved collection"
        type: boolean
        default: false

concurrency:
  group: collect-company-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-python.txt
      - name: Resolve reporting period
        id: report_period
        shell: bash
        env:
          INPUT_FROM_DATE: ${{ inputs.from_date }}
          INPUT_TO_DATE: ${{ inputs.to_date }}
          TZ: Asia/Seoul
        run: |
          if [[ -n "$INPUT_FROM_DATE" || -n "$INPUT_TO_DATE" ]]; then
            if [[ -z "$INPUT_FROM_DATE" || -z "$INPUT_TO_DATE" ]]; then
              echo "from_date and to_date must be supplied together" >&2
              exit 1
            fi
            from_date="$INPUT_FROM_DATE"
            to_date="$INPUT_TO_DATE"
          else
            current_month_start="$(date +%Y-%m-01)"
            from_date="$(date -d "$current_month_start -1 month" +%F)"
            to_date="$(date -d "$current_month_start -1 day" +%F)"
          fi

          if [[ "$(date -d "$from_date" +%F 2>/dev/null)" != "$from_date" ]] ||
             [[ "$(date -d "$to_date" +%F 2>/dev/null)" != "$to_date" ]] ||
             [[ "$from_date" > "$to_date" ]]; then
            echo "invalid reporting period: $from_date .. $to_date" >&2
            exit 1
          fi

          echo "from_date=$from_date" >> "$GITHUB_OUTPUT"
          echo "to_date=$to_date" >> "$GITHUB_OUTPUT"
          echo "Reporting period: $from_date .. $to_date"
      - name: Restore Gemini progress
        uses: actions/cache/restore@v5
        with:
          path: outputs/gemini_work
          key: gemini-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gemini-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-
      - name: Analyze articles and build both PDFs
        id: gemini
        env:
          REPORT_PROVIDER: ${{ inputs.provider || vars.REPORT_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          # 이름은 OPENAI_API_KEY 지만 내용은 NVIDIA build 키다.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_MAX_REQUESTS: ${{ inputs.gemini_max_requests || vars.GEMINI_MAX_REQUESTS || '400' }}
          REPORT_DELAY_MS: ${{ inputs.gemini_delay_ms || vars.GEMINI_DELAY_MS || '' }}
          REPORT_FROM_DATE: ${{ steps.report_period.outputs.from_date }}
          REPORT_TO_DATE: ${{ steps.report_period.outputs.to_date }}
          REPORT_ISSUE_NUMBER: ${{ inputs.issue_number || '2' }}
          REPORT_REFRESH: ${{ inputs.refresh || 'false' }}
        run: node scripts/gemini_report.mjs
      - name: Save progress even when quota is exhausted
        if: ${{ always() && steps.gemini.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: outputs/gemini_work
          key: gemini-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload progress and results for inspection
        if: ${{ always() && steps.gemini.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: gemini-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/gemini_work
          retention-days: 30
          if-no-files-found: ignore
      - name: Validate report inputs
        run: node scripts/validate_report_inputs.mjs
      - name: Downloadable bilingual PDFs
        uses: actions/upload-artifact@v6
        with:
          name: monthly-report-pdfs-${{ github.run_id }}
          path: public/reports/latest_report*.pdf
          retention-days: 30
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update Gemini company signals and bilingual reports"
          file_pattern: outputs/latest_*.json public/reports/latest_report.pdf public/reports/latest_report_en.pdf
